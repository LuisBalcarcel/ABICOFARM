<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if farmacia %}Editar{% else %}Nueva{% endif %} Sucursal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; color: #003366; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #00bcd4; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], input[type="time"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Montserrat'; box-sizing: border-box; }
        .time-row { display: flex; gap: 20px; }
        .time-row > div { flex: 1; }
        .btn { background-color: #ff6b00; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block;}
        .btn-cancel { background-color: #eee; color: #333; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if farmacia %}Editar Sucursal: {{ farmacia.nombre }}{% else %}Registrar Nueva Sucursal{% endif %}</h1>
        
        <form method="POST">
            <div class="form-group">
                <label>Nombre de la Farmacia</label>
                <input type="text" name="nombre" value="{{ farmacia.nombre if farmacia else '' }}" required>
            </div>

            <div class="form-group">
                <label>Jornada Operativa (Horario de atención)</label>
                <div class="time-row">
                    <div>
                        <label style="font-size: 12px; color: #666;">Hora de Apertura</label>
                        <input type="time" name="hora_inicio" value="{{ farmacia.jornada.split(' - ')[0] if farmacia and ' - ' in farmacia.jornada else '' }}" required>
                    </div>
                    <div>
                        <label style="font-size: 12px; color: #666;">Hora de Cierre</label>
                        <input type="time" name="hora_fin" value="{{ farmacia.jornada.split(' - ')[1] if farmacia and ' - ' in farmacia.jornada else '' }}" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn">Guardar Sucursal</button>
            <a href="{{ url_for('admin_farmacias') }}" class="btn btn-cancel">Cancelar</a>
        </form>
    </div>
</body>
</html>
