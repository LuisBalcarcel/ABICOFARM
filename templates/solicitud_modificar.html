<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Solicitud</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; color: #003366; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #ff6b00; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input[type="date"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Montserrat'; box-sizing: border-box; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;}
        .btn { background-color: #00bcd4; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: 700; cursor: pointer;}
        .btn-cancel { background-color: #eee; color: #333; margin-left: 10px; text-decoration: none; padding: 14px 20px; border-radius: 8px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Modificar Permiso: {{ solicitud.empleado.nombre }}</h1>
        
        <div class="info-box">
            <b>Fecha original solicitada:</b> {{ solicitud.fecha }}<br>
            <b>Motivo:</b> {{ solicitud.motivo }}
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>Nueva fecha propuesta (Aprobada):</label>
                <input type="date" name="nueva_fecha" value="{{ solicitud.fecha }}" required>
            </div>

            <div class="form-group">
                <label>Mensaje / Razón del cambio (Lo verá el empleado):</label>
                <input type="text" name="mensaje" placeholder="Ej. El 23 no puedo, te doy el 24." required>
            </div>

            <button type="submit" class="btn">Aprobar con Modificación</button>
            <a href="{{ url_for('admin_solicitudes') }}" class="btn-cancel">Cancelar</a>
        </form>
    </div>
</body>
</html>
